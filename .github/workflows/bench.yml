name: Statistical Performance Benchmarks

on:
  workflow_dispatch:
  schedule:
    # Run once a week at midnight UTC on Sundays
    - cron: '0 0 * * 0'

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,tokens] psutil pyperf pytest-benchmark

      - name: Run deterministic benchmarks and verify
        run: |
          python -m benchmarks.deterministic.runner
          swallo bench verify benchmarks/results/deterministic.json

      - name: Run statistical benchmarks
        run: |
          python -m benchmarks.perf.runner

      - name: Upload benchmark results artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: perf-benchmark-results
          path: benchmarks/results/perf/
          retention-days: 30

      - name: Runner Noise Disclaimer
        run: |
          echo "Note: GitHub Actions hosted runners share virtualized hardware with variable noisy neighbors."
          echo "These benchmark numbers are indicative of order-of-magnitude performance and not absolute."

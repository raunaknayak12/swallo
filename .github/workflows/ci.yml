name: CI

on:
  push:
    branches: [main, "fix/*"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-types:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sign,mcp]"

      - name: Run Ruff check
        run: python -m ruff check src tests

      - name: Run Mypy strict
        run: python -m mypy src/swallo

  test-matrix:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.14"
            experimental: true
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install dependencies with dev and sign extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,sign]"

      - name: Run Pytest test suite with coverage
        run: python -m pytest --cov=swallo --cov-report=xml --cov-report=term

  core-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install core package only (no extras)
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify zero non-standard runtime dependencies & zero warnings
        run: |
          python -W error -c "import swallo; print('swallo version:', swallo.__version__)"
          python -c "import sys; assert 'cryptography' not in sys.modules; assert 'tiktoken' not in sys.modules; assert 'mcp' not in sys.modules; print('Verified core runtime dependency isolation')"

      - name: Run core tests with pytest
        run: |
          python -m pip install pytest hypothesis
          python -m pytest

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install audit tools
        run: |
          python -m pip install --upgrade pip "setuptools>=84.1.0"
          python -m pip install pip-audit bandit .

      - name: Run pip-audit vulnerability scan
        run: python -m pip_audit

      - name: Run Bandit AST security scan
        run: python -m bandit -r src/swallo -ll -q

  build-and-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Build package and check distribution metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

name: TestPyPI Publishing

# Dry-run workflow: publishes a dev-versioned build to TestPyPI.
# Use version input like "0.1.4.dev1" to avoid burning "0.1.4" on TestPyPI.
# After publishing, manually trigger new-user-validation.yml with source=testpypi.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dev version to publish (e.g. 0.1.4.dev1). Do NOT use a release version."
        required: true
        default: "0.1.4.dev1"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages (${{ inputs.version }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine hatch

      - name: Override version for dev build
        run: |
          hatch version "${{ inputs.version }}"
          echo "Building version: $(hatch version)"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: python -m twine check --strict dist/*

      - name: Restore pyproject.toml version (do not commit dev version)
        run: git checkout pyproject.toml src/swallo/__init__.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-package-distributions-test
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI via Trusted Publishing (OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/swallo
    permissions:
      id-token: write  # Mandatory for TestPyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions-test
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

      - name: Post-publish reminder
        run: |
          echo "TestPyPI publish complete for ${{ inputs.version }}."
          echo "Next: trigger new-user-validation.yml with source=testpypi, version=${{ inputs.version }}"

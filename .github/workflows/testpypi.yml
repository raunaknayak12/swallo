name: TestPyPI Publishing

# Dry-run workflow: publishes a dev-versioned build to TestPyPI.
# Use version input like "0.1.4.dev1" to avoid burning "0.1.4" on TestPyPI.
# After publishing, manually trigger new-user-validation.yml with source=testpypi.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Dev version to publish (e.g. 0.1.4.dev1). Do NOT use a release version."
        required: true
        default: "0.1.4.dev1"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages (${{ inputs.version }})
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine hatch

      - name: Override version for dev build
        run: |
          python -c "import re; p = open('pyproject.toml').read(); open('pyproject.toml', 'w').write(re.sub(r'version = \".*?\"', 'version = \"${{ inputs.version }}\"', p, count=1))"
          python -c "import re; p = open('src/swallo/__init__.py').read(); open('src/swallo/__init__.py', 'w').write(re.sub(r'__version__ = \".*?\"', '__version__ = \"${{ inputs.version }}\"', p, count=1))"
          echo "Building version: ${{ inputs.version }}"

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: python -m twine check --strict dist/*

      - name: Restore pyproject.toml version (do not commit dev version)
        run: git checkout pyproject.toml src/swallo/__init__.py

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions-test
          path: dist/
          if-no-files-found: error

  publish-to-testpypi:
    name: Publish to TestPyPI via Trusted Publishing (OIDC)
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/swallo
    permissions:
      id-token: write  # Mandatory for TestPyPI Trusted Publishing (OIDC)
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions-test
          path: dist

      - name: Publish package distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          attestations: true

      - name: Post-publish reminder
        run: |
          echo "TestPyPI publish complete for ${{ inputs.version }}."
          echo "Next: trigger new-user-validation.yml with source=testpypi, version=${{ inputs.version }}"

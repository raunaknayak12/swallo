name: Tamper Detection Stress Test

on:
  workflow_dispatch:
  push:
    branches:
      - fix/tamper-mutation-deterministic
  pull_request:
    paths:
      - 'benchmarks/deterministic/tamper_detection.py'
      - 'scripts/run_tamper_stress.py'
      - '.github/workflows/tamper-stress-test.yml'

permissions:
  contents: read

jobs:
  stress-test:
    name: tamper-stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Install core package only (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify zero non-standard runtime dependencies & zero warnings
        run: |
          python -W error -c "import swallo"
          python -c "import sys, swallo; assert 'mcp' not in sys.modules; assert 'cryptography' not in sys.modules; assert 'tiktoken' not in sys.modules"

      - name: Run 500-iteration tamper detection stress test
        run: python scripts/run_tamper_stress.py

      - name: Run deterministic test suite via pytest
        run: python -m pytest tests/test_deterministic_benchmarks.py -v

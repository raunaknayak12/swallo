name: Tamper Detection Stress Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stress-test:
    name: tamper-stress (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"

      - name: Install core package only (no extras)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Verify zero non-standard runtime dependencies & zero warnings
        run: |
          python -W error -c "import swallo"
          python -c "import sys, swallo; assert 'mcp' not in sys.modules; assert 'cryptography' not in sys.modules; assert 'tiktoken' not in sys.modules"

      - name: Run 500-iteration tamper detection stress test
        run: python scripts/run_tamper_stress.py

      - name: Run 200-iteration deterministic benchmark suite stress test
        run: python scripts/run_deterministic_stress.py

      - name: Run deterministic test suite via pytest
        run: python -m pytest tests/test_deterministic_benchmarks.py -v

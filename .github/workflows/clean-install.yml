name: Clean Install Verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-install-matrix:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental || false }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - python-version: "3.14"
            experimental: true
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*

      - name: Install built wheel into isolated environment
        shell: bash
        run: |
          python -m venv test-venv
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PYTHON="test-venv/Scripts/python"
          else
            VENV_PYTHON="test-venv/bin/python"
          fi
          "$VENV_PYTHON" -m pip install --upgrade pip
          "$VENV_PYTHON" -m pip install dist/*.whl

      - name: Test zero-warning import and dependency isolation
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_PYTHON="test-venv/Scripts/python"
          else
            VENV_PYTHON="test-venv/bin/python"
          fi
          "$VENV_PYTHON" -W error -c "import swallo; print('Imported swallo v' + swallo.__version__)"
          "$VENV_PYTHON" -c "import sys; assert 'mcp' not in sys.modules; assert 'cryptography' not in sys.modules; assert 'tiktoken' not in sys.modules; print('Verified isolation')"

      - name: Verify CLI commands in temp directory
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            VENV_BIN="test-venv/Scripts"
          else
            VENV_BIN="test-venv/bin"
          fi
          export PATH="$PWD/$VENV_BIN:$PATH"
          swallo --help
          swallo version
          mkdir temp_workspace
          cd temp_workspace
          swallo init
          swallo doctor

name: Release Distribution

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build distribution packages
    runs-on: ubuntu-latest
    outputs:
      hash: ${{ steps.hash.outputs.hash }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check package metadata with twine
        run: python -m twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  provenance:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      contents: read
    steps:
      - name: Download distribution packages
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist

      - name: Generate build provenance attestations
        uses: actions/attest-build-provenance@c074443f1a5fb4a482973331dbe05b701c4403e6 # v2.2.3
        with:
          subject-path: "dist/*"

  publish-to-pypi:
    name: Publish to PyPI via Trusted Publishing (OIDC)
    needs: [build, provenance]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/swallo
    permissions:
      id-token: write  # Mandatory for PyPI Trusted Publishing (OIDC)
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          name: python-package-distributions
          path: dist

      - name: Publish package distributions to PyPI
        uses: pypa/gh-action-pypi-publish@76f52e663624b98718b9b586137374128f88d898 # release/v1
        with:
          packages-dir: dist/
          attestations: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87238604da993768fb109 # v2.2.1
        with:
          files: dist/*
          generate_release_notes: true

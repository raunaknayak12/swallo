[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swallo"
version = "0.1.0"
description = "Portable, reviewable handoff between any chat agent and any IDE"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Raunak Nayak" }
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Security",
]
dependencies = [
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
mcp = [
    "mcp>=1.0.0,<2.0.0",
]
tokens = [
    "tiktoken>=0.7.0",
]
pii = []
remote = []
sign = [
    "cryptography>=41.0.0",
]
dev = [
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "hypothesis>=6.100.0",
    "pip-audit>=2.7.0",
    "build>=1.0.0",
    "twine>=5.0.0",
    "pyperf>=2.6.0",
    "pytest-benchmark>=4.0.0",
]

[project.scripts]
swallo = "swallo.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/swallo"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"benchmarks/*" = ["S101", "S105", "S106", "S311", "E501"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src/swallo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "posix_only: skipped on Windows",
    "slow: long-running",
]
